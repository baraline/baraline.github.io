site_name: Antoine Guillaume
site_url: https://baraline.github.io
site_author: Antoine Guillaume
site_description: Personal homepage of Antoine Guillaume

repo_url: https://github.com/baraline/baraline.github.io
repo_name: baraline/baraline.github.io

theme:
  name: material
  favicon: https://github.com/baraline.png
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Professional:
      - Overview: professional/index.md
      - CV: professional/cv.md
      - Publications: professional/publications.md
      - Conferences: professional/conferences.md
      - Reviewer Work: professional/reviewer.md
      - Communications: professional/communications.md
  - Blog:
      - Blog Home: blog/index.md
  - Links: links.md

plugins:
  - search
  - blog:
      blog_dir: blog
      authors: true
      authors_file: blog/.authors.yml

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/baraline
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/antoine-guillaume
      name: LinkedIn
