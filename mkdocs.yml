site_name: Antoine Guillaume
site_url: https://baraline.github.io
site_author: Antoine Guillaume
site_description: Personal homepage of Antoine Guillaume

repo_url: https://github.com/baraline/baraline.github.io
repo_name: baraline/baraline.github.io

theme:
  name: material
  favicon: https://github.com/baraline.png
  palette:
    # Option 1: Deep Purple & Amber (Current - Modern & Professional)
    # Palette toggle for dark mode (default)
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    # Palette toggle for light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    
    # Option 2: Teal & Light Green (Uncomment to use - Fresh & Clean)
    # - scheme: default
    #   primary: teal
    #   accent: light green
    #   toggle:
    #     icon: material/brightness-7
    #     name: Switch to dark mode
    # - scheme: slate
    #   primary: teal
    #   accent: light green
    #   toggle:
    #     icon: material/brightness-4
    #     name: Switch to light mode
    
    # Option 3: Blue Grey & Cyan (Uncomment to use - Tech & Minimal)
    # - scheme: default
    #   primary: blue grey
    #   accent: cyan
    #   toggle:
    #     icon: material/brightness-7
    #     name: Switch to dark mode
    # - scheme: slate
    #   primary: blue grey
    #   accent: cyan
    #   toggle:
    #     icon: material/brightness-4
    #     name: Switch to light mode
    
    # Option 4: Custom Colors (Uncomment to use - Unique Brand)
    # - scheme: default
    #   primary: custom
    #   accent: custom
    #   toggle:
    #     icon: material/brightness-7
    #     name: Switch to dark mode
    # - scheme: slate
    #   primary: custom
    #   accent: custom
    #   toggle:
    #     icon: material/brightness-4
    #     name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant  # Instant loading (faster page transitions)
    - navigation.tracking  # URL updates with scroll position
    - navigation.expand  # Expand navigation by default
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share  # Share search results
    - content.code.copy
    - content.code.annotate  # Add annotations to code blocks
    - content.tabs.link  # Link content tabs across pages
  icon:
    repo: fontawesome/brands/github

# Custom CSS for additional styling (create this file)
extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Professional:
      - Overview: professional/index.md
      - CV: professional/cv.md
      - Publications: professional/publications.md
      - Conferences: professional/conferences.md
      - Reviewer Work: professional/reviewer.md
      - Communications: professional/communications.md
  - Blog:
      - Blog Home: blog/index.md
  - Links: links.md

plugins:
  - search
  - blog:
      blog_dir: blog
      authors: true
      authors_file: blog/.authors.yml

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/baraline
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/antoine-guillaume-69a83a101/
      name: LinkedIn
